name = "AssocLB"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["AssocLB"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# Mathlib, pinned to the release tag matching `lean-toolchain` so that
# `lake exe cache get` finds prebuilt oleans.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "AssocLB"
